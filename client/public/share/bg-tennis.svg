<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <radialGradient id="night" cx="50%" cy="16%" r="80%">
      <stop offset="0" stop-color="#1b2431"/>
      <stop offset="0.46" stop-color="#070b0c"/>
      <stop offset="1" stop-color="#010202"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.86"/>
      <stop offset="0.2" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18211d"/>
      <stop offset="0.52" stop-color="#0b1110"/>
      <stop offset="1" stop-color="#020303"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#efff99"/>
      <stop offset="0.52" stop-color="#83d51d"/>
      <stop offset="1" stop-color="#1f4109"/>
    </radialGradient>
    <filter id="blur">
